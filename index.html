<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recit Défilant</title>
  <link rel="stylesheet" href="css/variable.css" />
  <link rel="stylesheet" href="css/commun.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/chapitres/ch-01.css" />
  <link rel="stylesheet" href="css/chapitres/ch-02.css" />
  <link rel="stylesheet" href="css/chapitres/ch-03.css" />
  <link rel="stylesheet" href="css/chapitres/ch-04.css" />
  <link rel="stylesheet" href="css/chapitres/ch-05.css" />
  <link rel="stylesheet" href="css/chapitres/ch-06.css" />
  <link rel="stylesheet" href="css/chapitres/ch-07.css" />
</head>

<body>
      <div id="barre-progression" v-cloak>
      <div
        class="progression"
        :style="{ transform: 'scaleX(' + progress + ')' }"
      ></div>
    </div>
    <div id="navigation" v-cloak>
      <nav class="chapitres-nav">
        <ol>
          <li v-for="(chapter, index) in chapters" :key="chapter.id">
            <a
              :href="'#' + chapter.id"
              :class="{ actif : activeChapterIndex === index }"
              @click.prevent="goTo(chapter.id)"
            >
              {{ chapter.titre }}
            </a>
          </li>
        </ol>
      </nav>
    </div>
    <main id="recit"></main>


  <footer></footer>
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.js"></script>
  <script type="module" src="js/main.js"></script>
</body>

</html>
